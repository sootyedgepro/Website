                "@type": "Answer",

              }
            },
            {
              "@type": "Question",
              "name": "Do I need TradingView Premium?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Yes for full functionality. Multi-timeframe features — SootyEdge Flow Tracker's higher-timeframe grading and Key Levels confluence detection — both require Premium for the second timeframe data feed. The core indicators load on lower tiers but you'll hit TradingView's script and timeframe limits."
              }
            },
            {
              "@type": "Question",
              "name": "Are these signals I can copy?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "No. SootyEdge is decision support, not signal copy-trading. You see direction, levels, and a pre-mapped trade plan — you execute on your account, in your size, with your risk parameters. We don't push trades to you and we don't manage capital."
              }
            },
            {
              "@type": "Question",
              "name": "Can I cancel anytime?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Yes. Both monthly and annual subscriptions can be cancelled at any time from the Stripe customer portal in your confirmation email. Access continues until the end of the billing period you've already paid for."
              }
            },
            {
              "@type": "Question",
              "name": "Do you offer refunds?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "No. Due to the immediate digital delivery of indicator access and Inner Circle materials, all sales are final. You'll be asked to acknowledge the No-Refund Policy before checkout."
              }
            },
            {
              "@type": "Question",
              "name": "How quickly do I get access?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "TradingView indicator invites are sent within 24 hours of payment confirmation — usually within minutes during US market hours. Inner Circle Discord invite arrives in the same email."
              }
            },
            {
              "@type": "Question",
              "name": "What if my TradingView access has issues?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Email support@sootyedge.com with your purchase email and TradingView username. We re-issue indicator invites manually within one business day, no questions asked."

              "@type": "Question",
